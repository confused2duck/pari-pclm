<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discuss a crane requirement · Pari Solutions</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/workflows.css"><style>main{max-width:800px;margin:50px auto;padding:24px}.field{margin-bottom:16px}.input,.select{width:100%}h1{font-size:32px;margin:24px 0}form{margin-top:24px}label{display:block;margin-bottom:7px;font-size:14px}textarea{min-height:110px}</style></head><body><main><a href="index.html">Pari Solutions</a><h1>Discuss your crane requirement.</h1><p>Share your application, operating issue or project. This request creates an enquiry in Pari’s PCLM workspace.</p><form id="enquiry"><label for="name">Full name</label><input class="input" id="name" name="name" required><label for="company">Company</label><input class="input" id="company" name="company" required><label for="email">Work email</label><input class="input" id="email" name="email" type="email" required><label for="phone">Phone (optional)</label><input class="input" id="phone" name="phone"><label for="requirement_type">Requirement type</label><select class="select" id="requirement_type" name="requirement_type"><option>New crane</option><option>Reliability assessment</option><option>Maintenance / AMC</option><option>Modernization</option><option>Installation</option></select><label for="title">Requirement title</label><input class="input" id="title" name="title" required><label for="description">Application, symptoms or scope</label><textarea class="input" id="description" name="description" required></textarea><input name="website" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px"><label style="display:flex;gap:10px;margin:20px 0"><input type="checkbox" name="consent" required> I agree to be contacted by Pari Solutions about this enquiry and to the storage of these details for that purpose.</label><p role="status" id="result" style="margin:16px 0"></p><button class="btn btn-primary" type="submit">Submit technical enquiry</button></form></main><script>document.getElementById('enquiry').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button'),result=document.getElementById('result');button.disabled=true;try{const body=Object.fromEntries(new FormData(form));body.consent=form.elements.consent.checked;const response=await fetch('/api/public-enquiries',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':window.PARI_BOOTSTRAP.csrf},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.message);result.textContent='Your requirement has been recorded. Reference: '+data.reference;form.reset();}catch(error){result.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
